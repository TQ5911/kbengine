syntax = "proto3";

package DropGameServer;
option go_package = "../gameServerService";
option py_generic_services = true;

enum DropResult
{
    DropResult_UNKNOW = 0;
    DropResult_SUCCESS = 1; // 成功
    DropResult_NOT_FOUND = 2; // 掉落不存在
    DropResult_HAS_TAKEN = 3; // 已经拾取
    DropResult_STATE_ERROR = 4; // 状态错误
    DropResult_NOT_TAKER = 5; // 放弃时候，不是拾取者
    DropResult_EXPIRE = 6; // 掉落过期
    DropResult_NOT_OWNER = 7; // 不是掉落主人
    DropResult_NOT_EXPIRE = 8; // 掉落未过期
    DropResult_OTHER_GIVEUP = 9; // 其他人放弃了
    DropResult_OTHER_REDEEM = 10; // 其他人赎回了
}

message Void {
}

message RegisterGameServerRequest
{
    uint32 serverId = 1;
}

// 掉落
message DropRequest {
    uint32 serverId = 1;
    uint64 uniqueId = 2;
    uint64 dropGbId = 3;
    uint32 endTime = 4;
    uint32 dropTime = 5;
    bytes equipInfo = 6;
    bytes extraInfo = 7;
    uint32 collectionId = 8;
    uint32 price = 9;
    uint32 collExpireTime = 10; // 采集物过期时间，如果规定时间内没有拾取，则判定为系统拾取
}

// 拾取掉落装备
message TakeRequest {
    uint64 uniqueId = 1;
    uint64 takerGbId = 2;
}

// 拾取者放弃拾取的掉落装备
message GiveUpRequest {
    uint64 uniqueId = 1;
    uint64 takerGbId = 2;
    uint64 uuid = 3;
}

message GiveUpResponse {
    uint64 uniqueId = 1;
    uint64 dropGbId = 2;
    DropResult result = 3;
    uint64 uuid = 4;
}

// 掉落装备返还给主人的协议
message GetBackEquipResponse {
    uint64 uniqueId = 1;
    uint64 dropGbId = 2;
    bytes equipInfo = 3;
    bool isSelfTake = 4;
}

message TakeResponse {
    uint64 uniqueId = 1;
    uint64 dropGbId = 2;
    DropResult result = 3;
    bytes equipInfo = 4;
    uint32 endTime = 5;
    uint32 price = 6;
}

// 赎回请求
message RedeemRequest {
    uint64 uniqueId = 1;
    uint64 redeemerGbId = 2;
    uint32 price = 3;
    uint64 uuid = 4;
}

// 赎回响应
message RedeemResponse {
    uint64 uniqueId = 1;
    DropResult result = 2;
    uint64 uuid = 3;
}

// 通知掉落状态改变
message DropTypeChangeRequest {
    uint64 uniqueId = 1;
    uint32 dropType = 2;
    uint64 gbId = 3;
}

message NotifyTakerRedeemRequest {
    uint64 uniqueId = 1;
    uint64 takerGbId = 2;
}

// 掉落响应
message DropResponse {
    uint64 uniqueId = 1;
    bool success = 2;
}

// 获取拾取收益
message GetTakeRewardRequest {
    uint64 uniqueId = 1;
    uint64 takerGbId = 2;
    uint64 uuid = 3;
}

// 获取拾取收益响应
message GetTakeRewardResponse {
    uint64 uniqueId = 1;
    DropResult result = 2;
    uint32 price = 3;
    uint64 uuid = 4;
}

// 获取别人放弃的拾取装备
message FetchDropEquipRequest {
    uint64 uniqueId = 1;
    uint64 gbId = 2;
    uint64 uuid = 3;
}

// 获取别人放弃的拾取装备响应
message FetchDropEquipResponse {
    uint64 uniqueId = 1;
    uint32 giveUpTime = 2;
    DropResult result = 3;
    bytes equipInfo = 4;
    uint64 uuid = 5;
}

message GetDropInfoRequest {
    uint64 gbId = 1;
    uint64 uuid = 2;
}

message DropInfo {
    uint64 uniqueId = 1;
    uint64 takerGbId = 2;
    uint32 dropType = 3;
    uint32 endTime = 4;
    uint32 collExpireTime = 5;
    bytes extraInfo = 6;
    bytes equipInfo = 7;
    uint32 price = 8;
}

message TakerInfo {
    uint64 uniqueId = 1;
    uint64 dropGbId = 2;
    uint32 price = 3;
    uint32 endTime = 4;
    uint32 dropType = 5;
    bytes equipInfo = 6;
}

message GetDropInfoResponse {
    repeated DropInfo dropInfo = 1;
    repeated TakerInfo takerInfo = 2;
    uint64 uuid = 3;
}

// 移除掉落信息
message RemoveDropInfoRequest {
    uint64 uniqueId = 1;
    uint64 gbId = 2;
    uint64 uuid = 3;
}

// 移除掉落信息响应
message RemoveDropInfoResponse {
    uint64 uniqueId = 1;
    DropResult result = 2;
    uint64 uuid = 3;
    uint32 collectionId = 4;
}

message RemoveDropInfoNotifyTaker {
    uint64 uniqueId = 1;
    uint64 gbId = 2;
}

message SendRepairDropMailRequest {
    uint64 uniqueId = 1;
}

message SendRepairDropMailResponse {
    uint64 uniqueId = 1;
    uint64 gbId = 2;
    bytes equipInfo = 3;
    uint32 endTime = 4;
}

message UpdateCollEndTimeRequest {
    uint64 uniqueId = 1;
    uint32 collEndTime = 2;
}

message CheckDropExpireRequest {
    uint64 uniqueId = 1;
    uint64 uuid = 2;
    uint64 gbId = 3;
}

message CheckDropExpireResponse {
    uint64 uuid = 1;
    uint64 uniqueId = 2;
    DropResult result = 3;
}

message AddDropNotify {
    uint64 gbId = 1;
}

message GetDropNotifyListRequest {
    uint64 gbId = 1;
    uint64 uuid = 2;
}

message DropNotify {
    uint32 notifyType = 1;
    uint32 notifyTime = 2;
    uint64 uniqueId = 3;
    bytes equipInfo = 4;
}

message GetDropNotifyListResponse {
    repeated DropNotify dropNotify = 1;
    uint64 uuid = 2;
}

service DropServer {
    rpc registerGameServer(RegisterGameServerRequest) returns(Void);
    rpc drop(DropRequest) returns (Void);
    rpc take(TakeRequest) returns (Void);
    rpc redeem(RedeemRequest) returns (Void);
    rpc activeTick(Void) returns(Void);
    rpc giveUp(GiveUpRequest) returns(Void);
    rpc getTakeReward(GetTakeRewardRequest) returns(Void);
    rpc fetchDropEquip(FetchDropEquipRequest) returns(Void);
    rpc getDropInfo(GetDropInfoRequest) returns(Void);
    rpc removeDropInfo(RemoveDropInfoRequest) returns(Void);
    rpc sendRepairDropMail(SendRepairDropMailRequest) returns(Void);
    rpc updateCollEndTime(UpdateCollEndTimeRequest) returns(Void);
    rpc checkDropExpire(CheckDropExpireRequest) returns(Void);
    rpc getDropNotifyList(GetDropNotifyListRequest) returns(Void);
}

service GameServer {
    rpc onDrop(DropResponse) returns(Void);
    rpc onTake(TakeResponse) returns(Void);
    rpc onRedeem(RedeemResponse) returns(Void);
    rpc activeTickCallback(Void) returns(Void);
    rpc onGetBackEquip(GetBackEquipResponse) returns(Void);
    rpc onGiveUp(GiveUpResponse) returns(Void);
    rpc onDropTypeChange(DropTypeChangeRequest) returns(Void);
    rpc onGetTakeReward(GetTakeRewardResponse) returns(Void);
    rpc onFetchDropEquip(FetchDropEquipResponse) returns(Void);
    rpc onGetDropInfo(GetDropInfoResponse) returns(Void);
    rpc onRemoveDropInfo(RemoveDropInfoResponse) returns(Void);
    rpc onRemoveDropInfoNotifyTaker(RemoveDropInfoNotifyTaker) returns(Void);
    rpc onSendRepairDropMail(SendRepairDropMailResponse) returns(Void);
    rpc onCheckDropExpire(CheckDropExpireResponse) returns(Void);
    rpc onAddDropNotify(AddDropNotify) returns(Void);
    rpc onGetDropNotifyList(GetDropNotifyListResponse) returns(Void);
}
