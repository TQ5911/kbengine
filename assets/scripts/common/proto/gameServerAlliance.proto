    uint32 attackType = 1;   // 1=alliance, 2=guild
    uint64 attackId = 2;
    uint32 attackServerId = 3;
    uint32 targetType = 4;   // 1=alliance, 2=guild
    uint64 targetId = 5;
    uint32 targetServerId = 6;
    uint32 endTime = 7;
}

message EnemyRelationAllInfo {
    repeated EnemyRelationInfo relations = 1;
    uint32 version = 2;
}

