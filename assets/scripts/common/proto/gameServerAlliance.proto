syntax = "proto3";

package AllianceService;
option go_package = "../gameServerService";
option py_generic_services = true;

message Void {}

// ==== Core Data Structures ====

message AllianceInfo {
    uint64 allianceId = 1;
    string name = 2;
    string declaration = 3;
    uint64 leaderGuildId = 4;
    uint32 leaderServerId = 5;
    string leaderGuildName = 6;
    uint32 approveType = 7;
    uint64 fund = 9;
    uint32 memberCount = 10;
    uint64 totalScore = 11;
    // 2026-08-26 去掉冗余 serverId 字段(field 14),与 leaderServerId 语义重复
    // 老客户端读 d.serverId 不会报错(返回默认值 0),新代码统一用 leaderServerId
    uint32 createdAt = 15;
    uint64 leaderGbId = 16;
    string leaderName = 17;
    uint32 leaderLevel = 18;
    int32 leaderProfession = 19;       // 盟主职业
    uint32 leaderGender = 20;          // 盟主性别
}

// AllianceBasicInfo is a focused, read-only projection of an alliance's
// public card data: declaration + approval mode + leader identity. It
// powers the dedicated "get by allianceId" lookup so the caller does
// not have to fetch the full AllianceInfo + member list.
message AllianceBasicInfo {
    uint64 allianceId = 1;
    string declaration = 2;
    uint32 approveType = 3;
    string leaderName = 4;
    uint32 leaderGender = 5;
    uint32 leaderLevel = 6;
    uint32 leaderServerId = 7;
    int32 leaderProfession = 8;
    uint64 leaderGbId = 9;
}

message GetLeagueBasicInfoRequest {
    uint64 allianceId = 1;
    uint64 uuid = 2;
}

message GetLeagueBasicInfoResult {
    AllianceBasicInfo info = 1;
    uint32 errCode = 2;
    uint64 uuid = 3;
}

message LeagueSimpleMember {
    uint64 guildId = 1;
    string guildName = 2;
    uint32 guildIcon = 3;
    uint32 dspFlag = 4;
}

message LeagueSimpleInfo {
    uint64 allianceId = 1;
    string name = 2;
    uint64 totalScore = 3;
    repeated LeagueSimpleMember members = 4;
}

message GetLeagueSimpleInfoRequest {
    uint64 allianceId = 1;
    uint64 uuid = 2;
}

message GetLeagueSimpleInfoResult {
    LeagueSimpleInfo info = 1;
    uint32 errCode = 2;
    uint64 uuid = 3;
}

// ==== ApproveJoin guild-exists check ====
// allianceService asks the game server that owns the applying guild
// to verify the guild still exists before completing an ApproveJoin.
// Async: caller stores pending state keyed by `uuid`, resolves it when
// onCheckGuildExistsResult arrives.
message CheckGuildExistsRequest {
    uint64 guildId = 1;
    uint64 uuid = 2;
    bool checkCD = 3;
}

message CheckGuildExistsResult {
    uint64 uuid = 1;
    uint64 guildId = 2;
    string guildName = 3;
    bool exists = 4;
    uint32 guildCD = 5;
    bool checkCD = 6;
}

// ==== Cross-server guild simple info lookup ====
// When a player requests simple info for a guild on another server,
// the source game server sends GetGuildSimpleInfoRequest to the
// allianceService. The allianceService forwards it (via checkGuildSimpleInfo)
// to the target game server, which looks up the guild in GuildStub and
// responds via onCheckGuildSimpleInfoResult. The allianceService then
// delivers the result back to the source server via onGetGuildSimpleInfoResult.
message GuildSimpleInfo {
    uint64 guildId = 1;
    string guildName = 2;
    uint32 guildIcon = 3;
    uint32 dspFlag = 4;
    uint64 score = 5;
    uint32 guildLevel = 6;
    uint32 memberCnt = 7;
}

message GetGuildSimpleInfoRequest {
    uint64 guildId = 1;
    uint32 serverId = 2;
    uint64 uuid = 3;
}

message GetGuildSimpleInfoResult {
    GuildSimpleInfo info = 1;
    uint32 errCode = 2;
    uint64 uuid = 3;
}

// ==== NewApplyNotify ====
// Focused 5-field snapshot pushed to the alliance leader when a guild
// applies to join. Slimmer than AllianceApplyInfo — the leader only
// needs enough to render the apply card in the inbox (id + name +
// icon + dspFlag + power).
message NewApplyNotify {
    uint64 guildUUID = 1;
    string guildName = 2;
    uint32 guildIcon = 3;
    uint32 dspFlag = 4;
    uint64 power = 5;     // 帮会战力 (== AllianceApplyInfo.guildScore)
    uint64 leaderGbId = 6;
    uint64 applyTime = 7;
}

// ==== ApplyCancelledReason ====
// Why a pending apply was cancelled. Used by both apply-cancelled
// notification paths so the receiving game server can render the
// right system mail / toast without re-deriving the cause.
enum ApplyCancelledReason {
    APPLY_CANCEL_REASON_UNSPECIFIED = 0;
    // The applying guild was accepted by ANOTHER alliance. Per the
    // "one guild in one alliance" rule every other pending apply for
    // that guild is automatically revoked. This is the only cause we
    // fire today, but the enum is here so future cancel sources
    // (alliance disbanded, leader veto, etc.) can reuse the wire.
    APPLY_CANCEL_REASON_GUILD_JOINED_OTHER_ALLIANCE = 1;
}

// ==== ApplyCancelledNotify (→ alliance leader) ====
// Pushed to the alliance leader's game server when a pending apply
// targeting THEIR alliance is cancelled. The leader needs this so the
// apply row disappears from their inbox without waiting for a manual
// refresh; the cancellation is durable in MySQL but the leader's
// on-screen view is what the player actually sees.
//
// Routed by allianceId → leaderGuildId → leaderServerId on the
// allianceService side, so the receiving game server can trust the
// embedded serverId for which-side context (it will normally be the
// receiving server, but cross-server applies are valid).
message ApplyCancelledNotify {
    uint64 applyId = 1;          // 被取消的申请ID (== alliance_apply.id)
    uint64 allianceId = 2;       // 该申请对应的联盟ID (接收方 = 当前盟主)
    uint64 guildId = 3;          // 申请方帮会ID
    string guildName = 4;        // 申请方帮会名称 (方便直接渲染)
    uint32 serverId = 5;         // 申请方帮会所在 game serverId (跨服上下文)
    ApplyCancelledReason reason = 6; // 取消原因
    uint64 joinedAllianceId = 7; // 当 reason=GUILD_JOINED_OTHER_ALLIANCE 时, 该帮会最终加入了哪个联盟
}

// ==== SelfAppliesCancelledNotify (→ original applying guild) ====
// Pushed to the guild whose pending applies were force-cancelled
// because the guild itself was accepted by a different alliance.
// One batched message carries every cancelled apply so the guild's
// "sent applies" view can drop them all atomically.
//
// Routed by guildId → the server that hosts the applying guild
// (looked up from the apply snapshot cached at apply time, since
// after approval the guild is now a member of a different alliance).
message SelfAppliesCancelledNotify {
    uint64 guildId = 1;          // 该帮会 (接收方)
    uint64 joinedAllianceId = 2; // 该帮会最终加入了哪个联盟 (上下文, 让帮主知道为何被取消)
    ApplyCancelledReason reason = 3; // 取消原因 (整批共用同一原因)
    repeated ApplyCancelledItem cancelledApplies = 4; // 被取消的申请列表
}

// ApplyCancelledItem is the per-apply entry inside SelfAppliesCancelledNotify.
// Carries enough info to remove the row from the guild leader's sent-applies
// view AND to render any "you cancelled X" toast without re-querying.
// The 4 alliance-side fields (allianceId / allianceName / serverId /
// totalScore) match the data shape of the guild leader's sent-applies
// list, so the cancel notification and the list view share one row type.
message ApplyCancelledItem {
    uint64 applyId = 1;          // 被取消的申请ID
    uint64 allianceId = 2;       // 该申请对应的联盟ID
    string allianceName = 3;     // 联盟名称 (snapshot, 方便客户端直接显示)
    uint32 serverId = 4;         // 联盟所在 game serverId (== AllianceInfo.LeaderServerId, 即盟主所在服)
    uint64 totalScore = 5;       // 联盟战力 (== AllianceInfo.TotalScore, 所有成员帮会战力之和)
}

message AllianceMemberInfo {
    uint64 guildId = 1;
    string guildName = 2;
    uint32 serverId = 3;
    uint64 guildScore = 4;
    uint32 memberCount = 5;
    uint32 role = 6;
    uint32 joinTime = 7;
    uint32 guildIcon = 8;
    uint32 guildLevel = 9;
    // === Guild-level attributes (保留帮会级属性) ===
    uint32 dspFlag = 10;               // 帮会 dspFlag
    uint32 maxMemberNum = 11;          // 帮会上限成员数
    // === Guild leader personal info (帮会会长个人信息) ===
    uint64 leaderGbId = 12;            // 会长 GB ID
    string leaderName = 13;            // 会长名称
    uint32 leaderLevel = 14;           // 会长等级
    uint32 leaderProfession = 15;      // 会长职业
    uint32 leaderGender = 16;          // 会长性别
}

message AllianceApplyInfo {
    uint64 applyId = 1;
    uint64 allianceId = 2;
    uint64 guildId = 3;
    string guildName = 4;
    uint64 guildScore = 5;
    uint32 serverId = 6;
    uint32 status = 7;
    uint32 createdAt = 8;
    uint64 leaderGuildId = 9;
    // ==== Guild-level cosmetic attributes (snapshot at apply time) ====
    uint32 guildIcon = 10;       // 帮会 icon
    uint32 dspFlag = 11;         // 帮会 dspFlag
    // ==== Guild-level stats (snapshot at apply time) ====
    // These three are needed by completeApproveJoin so it can INSERT a
    // full alliance_member row without going back to the source game
    // server. They mirror ApplyToJoinRequest's guild-level fields.
    uint32 memberCount = 12;     // 帮会成员数 (== ApplyToJoinRequest.memberCount)
    uint32 guildLevel = 13;      // 帮会等级 (== ApplyToJoinRequest.guildLevel)
    uint32 maxMemberNum = 14;    // 帮会上限成员数 (== ApplyToJoinRequest.maxMemberNum)
    // === Applicant's guild leader personal info (申请人帮会会长个人信息) ===
    uint64 leaderGbId = 15;            // 会长 GB ID
    string leaderName = 16;            // 会长名称
    uint32 leaderLevel = 17;           // 会长等级
    uint32 leaderProfession = 18;      // 会长职业
    uint32 leaderGender = 19;          // 会长性别
}

message AllianceInviteMemberInfo {
    uint64 guildUUID = 1;
    string guildName = 2;
    uint64 guildScore = 3;
    uint32 guildIcon = 4;
    uint32 dspFlag = 5;
    uint32 guildLevel = 6;
    uint32 memberCount = 7;
    uint32 maxMemberNum = 8;
}

message AllianceInviteInfo {
    uint64 inviteId = 1;
    uint64 allianceId = 2;
    string allianceName = 3;
    uint32 serverId = 4;
    uint32 createdAt = 5;
    uint64 power = 6;
    uint32 status = 7;
    uint64 guildId = 8;
    repeated AllianceInviteMemberInfo members = 9; 
}

