    uint64 guildId = 2;
    uint32 itemId = 3;
    uint64 amount = 4;
    uint64 playerGbId = 5;
    uint64 uuid = 6;
}
message DonateFundResult {
    uint64 uuid = 1;
    uint32 errCode = 2;
    uint64 allianceFund = 3;
    uint64 allianceId = 4;
}
message AidResourceRequest {
    uint64 allianceId = 1;
    uint64 fromGuildId = 2;
    uint64 toGuildId = 3;
    uint32 itemId = 4;
    uint64 amount = 5;
    uint64 playerGbId = 6;
    uint64 uuid = 7;
}
message AidResourceResult {
    uint64 uuid = 1;
    uint32 errCode = 2;
}

message GetLeagueFundRequest {
    uint64 allianceId = 1;
    uint64 uuid = 2;
}
message GetLeagueFundResult {
    uint64 fund = 1;
    uint64 uuid = 2;
}

message GetEventListRequest {
    uint64 allianceId = 1;
    uint64 uuid = 2;
}
message GetEventListResult {
    repeated AllianceEventInfo events = 1;
    uint64 uuid = 2;
}

message NewEventBroadcast {
    uint64 allianceId = 1;
    AllianceEventInfo event = 2;
    // guildIds lists the member guilds on the receiving game server that
    // belong to this alliance. The central service groups member guilds by
    // serverId and sends each game server only the subset of guild IDs it
    // actually hosts, so the receiver can fan the event out to those guilds
    // without further filtering.
    repeated uint64 guildIds = 3;
}

message SendChatMessageRequest {
    uint64 allianceId = 1;
    uint64 senderGuildId = 2;
    string senderGuildName = 3;
    uint32 senderServerId = 4;
    string avatarInfo = 5;
    string content = 6;
    uint64 uuid = 7;
}
message SendChatMessageResult {
    uint64 uuid = 1;
    uint32 errCode = 2;
}

message ChatMessageBroadcast {
    uint64 allianceId = 1;
    AllianceChatMessage message = 2;
}

message GetChatHistoryRequest {
    uint64 allianceId = 1;
    uint32 limit = 2;
    uint64 uuid = 3;
}
message GetChatHistoryResult {
    repeated AllianceChatMessage messages = 1;
    uint64 uuid = 2;
}

message ReportGuildScoreRequest {
    uint64 guildId = 1;
    uint64 guildScore = 2;
    uint64 uuid = 3;
}
message ReportGuildScoreResult {
    uint64 uuid = 1;
    uint32 errCode = 2;
}

message SyncGuildInfoRequest {
    uint64 guildId = 1;
    string guildName = 2;
    uint32 guildIcon = 3;
    uint32 dspFlag = 4;
    uint32 guildLevel = 5;
    uint32 memberCount = 6;
    uint32 maxMemberCount = 7;
    uint64 guildScore = 8;
    uint64 leaderGbId = 9;
    string leaderName = 10;
    uint32 leaderLevel = 11;
    uint32 leaderProfession = 12;
    uint32 leaderGender = 13;
    uint64 uuid = 14;
}
message SyncGuildInfoResult {
    uint64 uuid = 1;
    uint32 errCode = 2;
}

message DisbandLeagueNotify {
    uint64 allianceId = 1;
    repeated uint64 guildIds = 2;
}

message NewMemberJoinedNotify {
    uint64 playerGbId = 1;
    AllianceMemberInfo member = 2;
}

message JoinToAllianceNotify {
    uint64 allianceId = 1;
    uint64 guildUUID = 2;
}

message ReturnGuildFundNotify {
    uint64 guildId = 1;
    uint32 srcType = 2;
    uint32 itemType = 3;
    uint64 itemNum = 4;
}

message GuildAidResourceNotify {
    uint64 guildId = 1;
    uint32 srcType = 2;
    uint32 itemType = 3;
    uint64 itemNum = 4;
}

message LeagueGuildLeave {
    uint64 guildId = 1;
    repeated uint64 memberGuildIds = 2;
}

message LeagueDisband {
    repeated uint64 memberGuildIds = 1;
}

message LeagueGuildEvent {
    uint64 guildId = 1;
    uint32 messageId = 2;
    repeated string messageArgs = 3;
}

message LeagueGuildMessage {
    uint64 guildId = 1;
    uint32 messageId = 2;
    repeated string messageArgs = 3;
}

message LeagueBroadCastMessage {
    uint64 fromUID = 1;
    uint64 toUID = 2;
    uint32 messageId = 3;
    repeated string messageArgs = 4;
}

message RecruitLeagueMemberRequest {
    uint64 uuid = 1;
    uint64 leagueUUID = 2;
}

message RecruitLeagueMemberResult {
    uint64 uuid = 1;
    uint64 leagueUUID = 2;
    uint32 errCode = 3;
}

message CheckLeaveGuildRequest {
    uint64 uuid = 1;
    uint64 leagueUUID = 2;
    uint64 guildId = 3;
    uint64 playerGbId =4;
}

message CheckLeaveGuildResult {
    uint64 uuid = 1;
    uint64 guildId = 2;
    uint64 playerGbId = 3;
    bool ret = 4;
}

message QueryLeagueUUIDRequest {
    uint64 uuid = 1;
    uint64 guildId = 2;
}

message QueryLeagueUUIDResult {
    uint64 uuid = 1;
    uint64 guildId = 2;
    uint64 leagueUUID = 3;
    bool ret = 4;
}

message EventTipsNotify {
    uint64 leagueUUID = 1;
    uint32 messageId = 2;
    repeated string messageArgs = 3;
}

message RemoveEnemyRelationRequest {
    uint64 uuid = 1;
    uint64 guildId = 2;
}

message RemoveEnemyRelationResponse {
    uint64 uuid = 1;
    uint64 guildId = 2;
    uint32 errCode = 3;
}

service AllianceService
{
    rpc registerGameServer(RegisterGameServerRequest) returns (Void);
    rpc activeTick(Void) returns (Void);
    rpc createLeague(CreateLeagueRequest) returns (Void);
    rpc disbandLeague(DisbandLeagueRequest) returns (Void);
    rpc modifyLeagueInfo(ModifyLeagueInfoRequest) returns (Void);
    rpc getLeagueList(GetLeagueListRequest) returns (Void);
    rpc searchLeague(SearchLeagueRequest) returns (Void);
    rpc getLeagueDetail(GetLeagueDetailRequest) returns (Void);
    rpc getLeagueBasicInfo(GetLeagueBasicInfoRequest) returns (Void);
    rpc applyToJoin(ApplyToJoinRequest) returns (Void);
    rpc approveJoin(ApproveJoinRequest) returns (Void);
    rpc onCheckGuildExistsResult(CheckGuildExistsResult) returns (Void);
    rpc rejectJoin(RejectJoinRequest) returns (Void);
    rpc cancelApply(CancelApplyRequest) returns (Void);
    rpc inviteGuild(InviteGuildRequest) returns (Void);
    rpc acceptInvite(AcceptInviteRequest) returns (Void);
    rpc rejectInvite(RejectInviteRequest) returns (Void);
    rpc kickMember(KickMemberRequest) returns (Void);
    rpc leaveLeague(LeaveLeagueRequest) returns (Void);
    rpc transferLeader(TransferLeaderRequest) returns (Void);
    rpc getApplyList(GetApplyListRequest) returns (Void);
    rpc getInviteList(GetInviteListRequest) returns (Void);
    rpc getSentApplies(GetSentAppliesRequest) returns (Void);
    rpc declareWar(DeclareWarRequest) returns (Void);
    rpc getEnemyList(GetEnemyListRequest) returns (Void);
    rpc getEnemyAllianceList(GetEnemyAllianceListRequest) returns (Void);
    rpc getLeagueSimpleInfo(GetLeagueSimpleInfoRequest) returns (Void);
    rpc getGuildSimpleInfo(GetGuildSimpleInfoRequest) returns (Void);
    rpc onCheckGuildSimpleInfoResult(GetGuildSimpleInfoResult) returns (Void);
    rpc checkLeagueRelation(CheckLeagueRelationRequest) returns (Void);
    rpc getGuildAlliance(GetGuildAllianceRequest) returns (Void);
    rpc donateFund(DonateFundRequest) returns (Void);
    rpc aidResource(AidResourceRequest) returns (Void);
    rpc getLeagueFund(GetLeagueFundRequest) returns (Void);
    rpc getEventList(GetEventListRequest) returns (Void);
    rpc sendChatMessage(SendChatMessageRequest) returns (Void);
    rpc getChatHistory(GetChatHistoryRequest) returns (Void);
    rpc reportGuildScore(ReportGuildScoreRequest) returns (Void);
    rpc syncGuildInfo(SyncGuildInfoRequest) returns (Void);
    rpc getUnionList(GetUnionListRequest) returns (Void);
    rpc recruitLeagueMember(RecruitLeagueMemberRequest) returns (Void);

    rpc checkLeaveGuild(CheckLeaveGuildRequest) returns (Void);

    rpc queryLeagueUUID(QueryLeagueUUIDRequest) returns (Void);

    rpc removeEnemyRelation(RemoveEnemyRelationRequest) returns (Void);
}

service GameClient
{
    rpc activeTickCallback(Void) returns (Void);
    rpc onCreateLeagueResult(CreateLeagueResult) returns (Void);
    rpc onDisbandLeagueResult(DisbandLeagueResult) returns (Void);
    rpc onModifyLeagueInfoResult(ModifyLeagueInfoResult) returns (Void);
    rpc onLeagueListResult(GetLeagueListResult) returns (Void);
    rpc onSearchLeagueResult(SearchLeagueResult) returns (Void);
    rpc onLeagueDetailResult(GetLeagueDetailResult) returns (Void);
    rpc onGetLeagueBasicInfoResult(GetLeagueBasicInfoResult) returns (Void);
    rpc onApplyToJoinResult(ApplyToJoinResult) returns (Void);
    rpc onApproveJoinResult(ApproveJoinResult) returns (Void);
    rpc checkGuildExists(CheckGuildExistsRequest) returns (Void);
    rpc onRejectJoinResult(RejectJoinResult) returns (Void);
    rpc onCancelApplyResult(CancelApplyResult) returns (Void);
    rpc onInviteGuildResult(InviteGuildResult) returns (Void);
    rpc onAcceptInviteResult(AcceptInviteResult) returns (Void);
    rpc onRejectInviteResult(RejectInviteResult) returns (Void);
    rpc onKickMemberResult(KickMemberResult) returns (Void);
    rpc onLeaveLeagueResult(LeaveLeagueResult) returns (Void);
    rpc onTransferLeaderResult(TransferLeaderResult) returns (Void);
    rpc onApplyListResult(GetApplyListResult) returns (Void);
    rpc onInviteListResult(GetInviteListResult) returns (Void);
    rpc onSentAppliesResult(GetSentAppliesResult) returns (Void);
    rpc onDeclareWarResult(DeclareWarResult) returns (Void);
    rpc onEnemyListResult(GetEnemyListResult) returns (Void);
    rpc onEnemyAllianceListResult(GetEnemyAllianceListResult) returns (Void);
    rpc onGetLeagueSimpleInfoResult(GetLeagueSimpleInfoResult) returns (Void);
    rpc checkGuildSimpleInfo(GetGuildSimpleInfoRequest) returns (Void);
    rpc onGetGuildSimpleInfoResult(GetGuildSimpleInfoResult) returns (Void);
    rpc onCheckLeagueRelationResult(CheckLeagueRelationResult) returns (Void);
    rpc onGetGuildAllianceResult(GetGuildAllianceResult) returns (Void);
    rpc onDonateFundResult(DonateFundResult) returns (Void);
    rpc onAidResourceResult(AidResourceResult) returns (Void);
    rpc onLeagueFundResult(GetLeagueFundResult) returns (Void);
    rpc onEventListResult(GetEventListResult) returns (Void);
    rpc onSendChatMessageResult(SendChatMessageResult) returns (Void);
    rpc onChatHistoryResult(GetChatHistoryResult) returns (Void);
    rpc onReportGuildScoreResult(ReportGuildScoreResult) returns (Void);
    rpc onSyncGuildInfoResult(SyncGuildInfoResult) returns (Void);
    rpc onWarStarted(WarStartedBroadcast) returns (Void);
    rpc onWarEnded(WarEndedBroadcast) returns (Void);
    rpc onNewEvent(NewEventBroadcast) returns (Void);
    rpc onChatMessage(ChatMessageBroadcast) returns (Void);
    rpc onDisbandLeagueNotify(DisbandLeagueNotify) returns (Void);
    rpc onNewApplyNotify(NewApplyNotify) returns (Void);
    rpc onNewInviteNotify(AllianceInviteInfo) returns (Void);

    // Guild relation broadcasts
    rpc onGuildRelationAll(GuildRelationAllInfo) returns (Void);
    rpc onBroadcastAddGuildRelation(GuildRelationInfo) returns (Void);
    rpc onBroadcastRemoveGuildRelation(GuildRelationRemoveInfo) returns (Void);

    // Entity-level enemy relation broadcasts (G↔G, G↔Alliance, A↔A)
    rpc onEnemyAllRelation(EnemyRelationAllInfo) returns (Void);
    rpc onBroadcastAddEnemyRelation(EnemyRelationInfo) returns (Void);
    rpc onBroadcastRemoveEnemyRelation(EnemyRelationInfo) returns (Void);

    rpc onNewMemberJoined(NewMemberJoinedNotify) returns (Void);

    rpc onJoinToAllianceNotify(JoinToAllianceNotify) returns (Void);

    rpc onUnionListResult(GetUnionListResult) returns (Void);

    rpc onReturnGuildFundNotify(ReturnGuildFundNotify) returns (Void);

    rpc onGuildAidResourceNotify(GuildAidResourceNotify) returns (Void);

    rpc onLeagueGuildLeave(LeagueGuildLeave) returns (Void);

    rpc onLeagueDisband(LeagueDisband) returns (Void);

    rpc onLeagueGuildEventNotify(LeagueGuildEvent) returns (Void);

    rpc onLeagueGuildMessageNotify(LeagueGuildMessage) returns (Void);
    
    rpc onLeagueBroadCastMessageNotify(LeagueBroadCastMessage) returns (Void);
    
    rpc onRecruitLeagueMemberResult(RecruitLeagueMemberResult) returns (Void);

    rpc onCheckLeaveGuildResult(CheckLeaveGuildResult) returns (Void);

    rpc onQueryLeagueUUIDResult(QueryLeagueUUIDResult) returns (Void);

    rpc onEventTipsNotify(EventTipsNotify) returns (Void);

    rpc onRemoveEnemyRelation(RemoveEnemyRelationResponse) returns (Void);
}
