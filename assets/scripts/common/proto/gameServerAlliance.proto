// ==== Guild Relation Broadcast ====

message GuildRelationInfo {
    uint64 guildUUID1 = 1;
    uint64 guildUUID2 = 2;
    uint32 relationType = 3;    // 0=NONE, 1=UNION, 2=ENEMY
    uint32 endTime = 4;         // 0=permanent (for UNION), >0=war end time (for ENEMY)
