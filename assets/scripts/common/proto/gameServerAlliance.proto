    uint32 sendTime = 6;
    // 2026-08-24 联盟频道新增:消息来源类型
    // 0=玩家发言(senderGuildId/Name 有效)
    // 1=系统消息(援助/宣战等,以系统身份发送的频道文本,content 已格式化为最终展示文本)
    uint32 senderType = 7;
}

