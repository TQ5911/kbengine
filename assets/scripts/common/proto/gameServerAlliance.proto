    uint64 playerGbId = 6;
    uint64 uuid = 7;
    string leaderName = 8;
    uint32 leaderLevel = 9;
    uint64 allianceId = 10;
    // === Leader data (盟主数据) ===
    uint32 leaderServerId = 11;        // 盟主 serverId
    int32 leaderProfession = 12;       // 盟主职业 (GuildMemberVal.job)
    uint32 leaderGender = 13;          // 盟主性别 (GuildMemberVal.sex, 0未知/1男/2女)
    // === Leader's guild data (盟主所在帮会数据) ===
    string guildName = 14;             // 帮会名字
    uint32 dspFlag = 15;               // 帮会 dspFlag
    uint32 guildIcon = 16;             // 帮会 icon
    uint64 guildScore = 17;            // 帮会 score
    uint32 guildLevel = 18;            // 帮会 level
