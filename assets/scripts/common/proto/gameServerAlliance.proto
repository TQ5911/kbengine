// ==== SentApplyItem ====
// One row in the guild leader's "sent applies" list. Distinct from
// AllianceApplyInfo (which is the full apply record used by approve /
// reject flows); SentApplyItem is the focused projection the leader's
// inbox actually needs to render a row:
//
//   - applyId       : the apply row's primary key, used to cancel it
//   - allianceId    : which alliance the guild applied to
//   - allianceName  : display label (snapshot at query time)
//   - serverId      : alliance's home server (== AllianceInfo.LeaderServerId)
//   - totalScore    : alliance power (== AllianceInfo.TotalScore, snapshot)
//   - createdAt     : when the apply was sent, for "X days ago" UI
//   - status        : the apply state (typically PENDING for sent applies)
//
// The 4 alliance-side fields match ApplyCancelledItem so the cancel
// notification and the live list share one row schema on the client.
message SentApplyItem {
    uint64 applyId = 1;
    uint64 allianceId = 2;
    string allianceName = 3;
    uint32 serverId = 4;
    uint64 totalScore = 5;
    uint32 createdAt = 6;
    uint32 status = 7;
}

