# centralService 服务清单
#
# 这是部署编排的唯一事实来源：install.sh / healthcheck.sh / upgrade.sh
# 都按本文件的顺序工作。
#
# 格式（竖线分隔，井号后为注释）：
#   name | probe_ports | db_init | description
#
#   name         服务名。必须与仓库中的目录名、可执行文件名同名。
#                原因：src/common/utils.go 用「可执行文件所在目录名」推导配置文件名，
#                即 <服务名>.json，所以安装目录必须叫 <name>。
#   probe_ports  启动后用于 TCP 探活的端口，逗号分隔。改端口后必须同步改这里。
#   db_init      yes=部署时自动执行该服务的 up.sh 建库导表；no=跳过。
#   description  中文说明，仅用于日志输出。
#
# 行的先后顺序 = 启动顺序：登录/排队/路由在前，业务服居中，GMT 后台最后。

centralLogin     | 2020,2030,8999     | yes | 登录网关（客户端接入 + 对游戏服指令）
queueServer      | 4396                | no  | 排队与限流
router           | 2060,2061           | no  | 路由与集群同步
maple            | 9527                | yes | 大区/地图数据服务
auction          | 2010                | yes | 拍卖行
orderService     | 2011,8888           | yes | 订单与支付
allianceService  | 2150                | yes | 公会
leaseServer      | 2015                | yes | 装备租赁
dropServer       | 2120                | yes | 掉落结算
crossDataServer  | 2140                | yes | 跨服数据
crossTeamServer  | 2016                | no  | 跨服队伍
admin            | 8080,8081,2040,2050,2051 | no | GMT 后台（2050 为 grpc-web 入口）